name: Angular build and smoke test

on:
  push:
    branches: [angular]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Versions
        run: |
          node -v
          npx ng version

      - name: Build
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run smoke

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-out
          if-no-files-found: ignore

      - name: Save lock file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore
