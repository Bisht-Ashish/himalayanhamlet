name: Deploy to VPS

# Runs only when you start it from the Actions tab.
# Needs these repository secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the Angular site
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Set up SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copy files to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          rsync -avz --delete \
            --exclude 'booked.json' \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/himalayan-hamlet/browser/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"
