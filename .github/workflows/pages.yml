name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every hour: refresh booked dates from the Airbnb calendar and republish
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the Angular site
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Collect site files
        run: |
          mkdir _site
          cp -r dist/himalayan-hamlet/browser/. _site/

      - name: Sync Airbnb calendar (booked dates only)
        continue-on-error: true
        env:
          ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKED_OUTPUT: _site/booked.json
        run: |
          if [ -z "$ICAL_URL" ]; then
            echo "AIRBNB_ICAL_URL secret is not set; skipping calendar sync."
            exit 0
          fi
          python3 sync_ical.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
